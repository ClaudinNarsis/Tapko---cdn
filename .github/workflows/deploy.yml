name: Deploy to S3

on:
  push:
    branches:
      - main  # or your production branch name
  workflow_dispatch:  # Allows manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          NODE_ENV: production
          API_URL: ${{ secrets.API_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Debug S3 configuration
        run: |
          echo "PROD_S3_BUCKET: ${{ secrets.PROD_S3_BUCKET }}"
          echo "PROD_S3_PATH: ${{ secrets.PROD_S3_PATH }}"
          echo "Full S3 path will be: s3://${{ secrets.PROD_S3_BUCKET }}/${{ secrets.PROD_S3_PATH }}tapko-widget.js"

      - name: Upload to S3 and set public ACL
        run: |
          aws s3 cp dist/tapko-widget.js \
            "s3://${{ secrets.PROD_S3_BUCKET }}/${{ secrets.PROD_S3_PATH }}tapko-widget.js" \
            --acl public-read \
            --cache-control "public, max-age=31536000" \
            --content-type "application/javascript"

          aws s3 cp dist/tapko-widget.debug.js \
            "s3://${{ secrets.PROD_S3_BUCKET }}/${{ secrets.PROD_S3_PATH }}tapko-widget.debug.js" \
            --acl public-read \
            --cache-control "public, max-age=31536000" \
            --content-type "application/javascript"

      - name: Deployment Summary
        run: |
          echo "✅ Deployment successful!"
          echo "📦 Files uploaded to: s3://${{ secrets.PROD_S3_BUCKET }}/${{ secrets.PROD_S3_PATH }}"
          echo "🔗 Public URL: https://${{ secrets.PROD_S3_BUCKET }}.s3.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.PROD_S3_PATH }}tapko-widget.js"
